# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mixin refmap remapping for dev environment (fixes CoFH Core mixin issues)
mixin.env.remapRefMap=true

# Mod properties
mod_version = 1.0.1
mod_id = beemastery
mod_name = Bee Mastery
mod_group_id = io.github.elias.beemastery
mod_author = Elias Friedlaender
mod_description = Master the art of beekeeping with 11 unique bee species, legendary tools, and powerful frames for Forestry CE

# Minecraft properties
minecraft_version = 1.20.1
minecraft_version_range = [1.20.1,1.21)
forge_version = 47.3.11
forge_version_range = [47.3.5,)
loader_version_range = [47,)

# Dependencies
forestry_version = [2.5.0,)
