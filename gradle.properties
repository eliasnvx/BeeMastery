# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod properties
mod_version = 1.2.1
mod_id = beemastery
mod_name = Bee Mastery
mod_group_id = io.github.elias.beemastery
mod_author = Elias Friedlaender
mod_description = Master the art of beekeeping with 11 unique bee species, legendary tools, and powerful frames for Forestry CE

# Minecraft properties
minecraft_version = 1.21.1
minecraft_version_range = [1.21.1,1.22)
neo_version = 21.1.251
neo_version_range = [21.1.251,)
loader_version_range = [4,)

# Dependencies
forestry_version = [3.0.0-alpha6,)
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
