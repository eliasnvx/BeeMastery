name: 🔨 Build

on:
  pull_request:
    branches: [ '1.20.1-dev', '1.21.1-dev', 'main' ]
  push:
    branches: [ '1.20.1-dev', '1.21.1-dev' ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build:
    name: 🏗️ Build Bee Mastery
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: 🗂️ Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 🧹 Cleanup Gradle cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
      
      - name: 🔧 Prepare Gradle for CI
        run: |
          chmod +x gradlew
          # gradle.properties may pin a local (macOS) JDK path; CI uses the JDK set up above.
          sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: 🏗️ Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"

      # Creates a real world and checks that recipes, bee mutations and the guide book
      # loaded. Only on branches that have the smoke test (1.21.1+).
      - name: 🧪 Datapack smoke test (world creation)
        if: hashFiles('src/main/java/**/gametest/*.java') != ''
        run: ./gradlew runGameTestServer --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3G"

      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BeeMastery-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30
      
      - name: 📝 Build summary
        if: success()
        run: |
          echo "### ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts uploaded successfully!" >> $GITHUB_STEP_SUMMARY
