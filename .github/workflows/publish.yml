name: 📤 Publish

on:
  push:
    branches: [ '1.20.1-dev' ]
  workflow_dispatch:
    inputs:
      publish_curseforge:
        description: 'Publish to CurseForge'
        required: true
        type: boolean
        default: false
      publish_modrinth:
        description: 'Publish to Modrinth'
        required: true
        type: boolean
        default: false

jobs:
  publish:
    name: 🌐 Publish to Platforms
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, '[Release]') || github.event_name == 'workflow_dispatch'"
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      
      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: 🏗️ Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3G"
      
      - name: 📤 Upload to CurseForge
        if: |
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[Release]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_curseforge == 'true')
        run: ./gradlew curseforge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      
      - name: 📤 Upload to Modrinth
        if: |
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[Release]')) ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_modrinth == 'true')
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      
      - name: ✅ Publish summary
        run: |
          echo "### 🎉 Publish Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.publish_curseforge }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "✅ Published to CurseForge" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ github.event.inputs.publish_modrinth }}" == "true" ] || [ "${{ github.event_name }}" == "push" ]; then
            echo "✅ Published to Modrinth" >> $GITHUB_STEP_SUMMARY
          fi
